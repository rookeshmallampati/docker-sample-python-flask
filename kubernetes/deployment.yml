apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-flask-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-flask-app
  template:
    metadata:
      labels:
        app: python-flask-app
    spec:
      containers:
      - name: python-flask-app-container
        image: rookesh975/flask_app:v1 # Correct image name here
        imagePullPolicy: Always 
        ports:
        - containerPort: 8080
